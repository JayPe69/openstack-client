name: Set up Docker publishing
description: Configure Docker Buildx and authenticate with Docker Hub
inputs:
  username:
    description: Docker Hub username
    required: true
  password:
    description: Docker Hub password or token
    required: true
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker Hub credentials
      shell: bash
      env:
        DOCKER_USERNAME: ${{ inputs.username }}
        DOCKER_PASSWORD: ${{ inputs.password }}
      run: |
        if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
          echo "Error: DOCKER_USERNAME or DOCKER_PASSWORD secrets are not set"
          exit 1
        fi

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
