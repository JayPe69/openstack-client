name: Build and Push OpenStack CLI Docker Image

on:
  schedule:
    # Run every Monday at 8:00 AM UTC (Monday morning)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      version: ${{ steps.versions.outputs.version }}
      octavia: ${{ steps.versions.outputs.octavia }}
      cinder: ${{ steps.versions.outputs.cinder }}
      neutron: ${{ steps.versions.outputs.neutron }}
      tag_exists: ${{ steps.versions.outputs.tag_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test maintained OpenStack build discovery
        run: sh ./tests/test-maintained-openstack-builds.sh

      - name: Resolve maintained OpenStack builds
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          builds=$(sh ./scripts/get-maintained-openstack-builds.sh)
          version=$(./scripts/get-latest-version.sh)
          matrix=$(jq -c '{include: .}' <<< "$builds")

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "octavia=$(./scripts/get-latest-octavia-version.sh)" >> "$GITHUB_OUTPUT"
          echo "cinder=$(./scripts/get-latest-cinder-version.sh)" >> "$GITHUB_OUTPUT"
          echo "neutron=$(./scripts/get-latest-neutron-version.sh)" >> "$GITHUB_OUTPUT"

          tag="v${version}"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag exists: latest image will be rebuilt for security updates"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Build matrix: ${matrix}"

  build-and-push:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Error: DOCKER_USERNAME or DOCKER_PASSWORD secrets are not set"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jnovent/openstack-client
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.name }}-${{ matrix.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            VERSION=${{ matrix.version }}
            OCTAVIA_VERSION=${{ needs.versions.outputs.octavia }}
            CINDER_VERSION=${{ needs.versions.outputs.cinder }}
            NEUTRON_VERSION=${{ needs.versions.outputs.neutron }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  build-latest:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Error: DOCKER_USERNAME or DOCKER_PASSWORD secrets are not set"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract latest image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jnovent/openstack-client
          flavor: latest=false
          tags: |
            type=raw,value=v${{ needs.versions.outputs.version }}
            type=raw,value=latest

      - name: Build and push latest Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            VERSION=${{ needs.versions.outputs.version }}
            OCTAVIA_VERSION=${{ needs.versions.outputs.octavia }}
            CINDER_VERSION=${{ needs.versions.outputs.cinder }}
            NEUTRON_VERSION=${{ needs.versions.outputs.neutron }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  release:
    needs:
      - versions
      - build-latest
    if: needs.versions.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
          OCTAVIA_VERSION: ${{ needs.versions.outputs.octavia }}
          CINDER_VERSION: ${{ needs.versions.outputs.cinder }}
          NEUTRON_VERSION: ${{ needs.versions.outputs.neutron }}
        run: |
          tag="v${VERSION}"
          git tag "$tag"
          git push origin "$tag"
          cat > release-notes.md <<EOF
          ## Embedded OpenStack CLI versions

          | Client | Version |
          | --- | --- |
          | python-openstackclient | ${VERSION} |
          | python-octaviaclient | ${OCTAVIA_VERSION} |
          | python-cinderclient | ${CINDER_VERSION} |
          | python-neutronclient | ${NEUTRON_VERSION} |

          Docker image: \`jnovent/openstack-client:${tag}\`
          EOF
          gh release create "$tag" --title "$tag" --notes-file release-notes.md
